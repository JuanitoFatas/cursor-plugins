name: GHA smoke

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Print runner facts
        run: |
          echo "runner os: ${{ runner.os }}"
          echo "runner arch: ${{ runner.arch }}"
          echo "event: ${{ github.event_name }}"
